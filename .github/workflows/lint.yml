name: lint
on: [push, pull_request, workflow_dispatch]
jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: npm install
        run: npm i
      - name: npm run check
        run: npm run check
      - name: npm run lint
        run: npm run lint
